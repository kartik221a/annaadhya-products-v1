name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (required for app builds)
        run: |
          pnpm --filter @annaadhya/utils build
          pnpm --filter @annaadhya/contracts build
          pnpm --filter @annaadhya/data-core build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unit & integration tests
        run: pnpm -r test

      - name: Build API
        run: pnpm --filter @annaadhya/api build

      - name: Build storefront
        run: pnpm --filter @annaadhya/storefront build
        env:
          API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_SITE_URL: https://staging.example.com

      - name: Build admin
        run: pnpm --filter @annaadhya/admin build

      - name: Seed tools self-check
        run: |
          pnpm seed:validate
          pnpm seed:dry-run
